services:
  - type: web
    name: asa-oz-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional — see DEPLOY.md for the full list of supported env vars
      # (STRIPE_*, SMTP_*, GOOGLE_DRIVE_*, ADSENSE_PUBLISHER_ID, APP_URL).
