services:
  - type: web
    name: asa-oz-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: asa-oz-prod-secret-key-change-me
