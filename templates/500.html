{% extends "base.html" %}
{% block title %}Something went wrong — Asa-OZ{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/about.css') }}">{% endblock %}
{% block main %}
      <section class="error-page" style="min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4rem 1.5rem;">
        <p class="eyebrow">500</p>
        <h1>Something slipped.</h1>
        <p style="max-width:34rem; color:var(--muted); line-height:1.7;">An unexpected error occurred. Please try again in a moment, or email <a href="mailto:info@asa-oz.com" style="color:var(--sage-deep);">info@asa-oz.com</a> for help.</p>
        <p style="margin-top:1.5rem;"><a href="{{ url_for('index') }}" class="pricing-btn" style="text-decoration:none; display:inline-block;">Return home</a></p>
      </section>
{% endblock %}
