{% extends "admin/base.html" %}
{% block title %}Password - Asa-OZ Admin{% endblock %}
{% block body %}
<div class="admin-wrap">
  <div class="admin-header"><h1>Change password</h1>
    <div class="actions"><a class="btn btn-ghost" href="{{ url_for('admin_dashboard') }}">Back</a><form method="POST" action="{{ url_for('admin_logout') }}"><button class="btn">Sign out</button></form></div>
  </div>
  {% include "admin/_nav.html" %}
  <div class="card" style="max-width:520px;">
    <p class="sub">Update the admin username and password. New password must be at least 8 characters.</p>
    <form method="POST" action="{{ url_for('admin_password') }}">
      <div class="form-row"><label>Username</label><input name="username" value="{{ admin_user }}" required /></div>
      <div class="form-row"><label>New password</label><input type="password" name="password" minlength="8" required autocomplete="new-password" /></div>
      <button class="btn" type="submit">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
