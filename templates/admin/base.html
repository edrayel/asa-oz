<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Asa-OZ Admin{% endblock %}</title>
  <link rel="icon" href="{% if brand_settings.favicon %}{{ brand_settings.favicon }}{% else %}data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b2118'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-style='italic' font-size='18' fill='%23a67b5b' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E{% endif %}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  {% block styles %}{% endblock %}
  {% block head %}{% endblock %}
</head>
<body class="admin-body">
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/autogrow.js') }}"></script>
  {% if session.get('admin') %}<script src="{{ url_for('static', filename='js/admin.js') }}" defer></script>{% endif %}
</body>
</html>
