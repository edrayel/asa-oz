{% from "partials/macros.html" import icon_svg as icon, social_links %}
<header>
  <div class="brand">
    <a href="{{ url_for('index') }}" class="brand-link">
      <span class="brand-logo-fallback">Asa-OZ</span>
      <img class="brand-logo-img" src="{{ url_for('static', filename='images/logo.svg') }}" alt="Asa-OZ"
        onload="var f=this.previousElementSibling; if(f&&f.classList.contains('brand-logo-fallback'))f.style.display='none';"
        onerror="this.style.display='none';">
    </a>
  </div>
  <nav class="main-nav" aria-label="Main">
    {% set items = [('index','Home'), ('about','About'), ('store','Store'), ('faq','FAQ'), ('contact','Contact')] %}
    {% for endpoint, label in items %}
      <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} class="active"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
  <div class="header-social" aria-label="Social media">{{ social_links(16) }}</div>
  <div class="header-actions">
    <button type="button" class="header-booking" id="headerBookingTrigger">
      <span class="header-booking-text">{{ settings.get('booking_label', 'Book a discovery call') }}</span>
      <span class="header-booking-icon">{{ icon('<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>', 18) }}</span>
    </button>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      {{ icon('<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>', 18) }}
    </button>
    <button class="cart-toggle" id="cartToggle" aria-label="Open cart">
      {{ icon('<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>', 18) }}
      <span class="cart-count" id="cartCount"{% if not cart_count %} style="display:none;"{% endif %}>{{ cart_count }}</span>
    </button>
  </div>
</header>
