<div class="booking-confirmation" id="bookingConfirm" style="display:flex;">
  <div class="confirm-icon" aria-hidden="true">&#10003;</div>
  <h4>{{ cms_booking.confirm_title }}</h4>
  <p>{{ cms_booking.confirm_body.format(email=cms_site.email) | safe }}</p>
</div>
<div class="booking-footer" id="bookingFooter" style="justify-content:center;">
  <button type="button" class="booking-btn booking-btn-primary" onclick="document.getElementById('bookingOverlay').classList.remove('open');document.body.style.overflow='';">{{ cms_booking.confirm_close }}</button>
</div>
