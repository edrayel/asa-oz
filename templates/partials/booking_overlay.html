<div class="booking-overlay" id="bookingOverlay" role="dialog" aria-modal="true" aria-label="Book a discovery call">
  <div class="booking-modal">
    <div class="booking-header">
      <h3>{{ cms_booking.label }}</h3>
      <button class="booking-close" id="bookingClose" aria-label="Close booking form" type="button">&#10005;</button>
    </div>
    <div class="booking-body" id="bookingBody">
      <form id="bookingForm" action="{{ url_for('booking') }}" method="POST" novalidate>
        <div class="booking-field" id="fieldName">
          <label for="bName">{{ cms_booking.full_name }}</label>
          <input type="text" id="bName" name="name" placeholder="{{ cms_booking.placeholder_full }}" required />
          <span class="error-msg">{{ cms_booking.err_name }}</span>
        </div>
        <div class="booking-field" id="fieldEmail">
          <label for="bEmail">{{ cms_booking.email }}</label>
          <input type="email" id="bEmail" name="email" placeholder="{{ cms_booking.placeholder_email }}" autocomplete="email" required />
          <span class="error-msg">{{ cms_booking.err_email }}</span>
        </div>
        <div class="booking-field" id="fieldPhone">
          <label for="bPhone">{{ cms_booking.phone }} <span style="font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span></label>
          <input type="tel" id="bPhone" name="phone" placeholder="{{ cms_booking.placeholder_phone }}" autocomplete="tel" />
        </div>
        <div class="booking-row">
          <div class="booking-field" id="fieldDate">
            <label for="bDate">{{ cms_booking.date }}</label>
            <input type="date" id="bDate" name="date" required />
            <span class="error-msg">{{ cms_booking.err_date }}</span>
          </div>
          <div class="booking-field" id="fieldTime">
            <label for="bTime">{{ cms_booking.time }}</label>
            <input type="time" id="bTime" name="time" required />
            <span class="error-msg">{{ cms_booking.err_time }}</span>
          </div>
        </div>
        <div class="booking-field" id="fieldMessage">
          <label for="bMessage">{{ cms_booking.topic }}</label>
          <textarea id="bMessage" name="message" rows="4" placeholder="{{ cms_booking.placeholder_topic }}"></textarea>
        </div>
        <div class="booking-footer" id="bookingFooter">
          <button type="button" class="booking-btn booking-btn-secondary" id="bookingCancel">{{ cms_booking.cancel }}</button>
          <button type="submit" class="booking-btn booking-btn-primary">{{ cms_booking.submit }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
